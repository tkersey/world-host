name: Public reference stack

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install Zig 0.16.0
        run: |
          zig_archive="$RUNNER_TEMP/zig-x86_64-linux-0.16.0.tar.xz"
          zig_root="$GITHUB_WORKSPACE/.ci-toolchain/zig-0.16.0"
          curl --fail --location --silent --show-error \
            --output "$zig_archive" \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $zig_archive" \
            | sha256sum --check --strict
          mkdir -p "$zig_root"
          tar -xJf "$zig_archive" --strip-components=1 -C "$zig_root"
          "$zig_root/zig" version
      - name: Run deterministic tests
        run: |
          export PATH="$GITHUB_WORKSPACE/.ci-toolchain/zig-0.16.0:$PATH"
          zig version
          bun test --timeout 30000
      - run: bun run proof:v1-tests
      - run: bun run check:public-runtime-v1
      - run: bun run conformance:public-runtime-v1
