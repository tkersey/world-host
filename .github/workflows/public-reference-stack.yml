name: Public reference stack

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun test --timeout 30000
      - run: bun run proof:v1-tests
      - run: bun run check:public-runtime-v1
      - run: bun run conformance:public-runtime-v1
